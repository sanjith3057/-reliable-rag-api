<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 678" width="1010" height="678" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What is stored">
<title>What is stored</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1010" height="678" fill="#FFFFFF"/>
<rect x="30" y="40" width="440" height="224" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/><path d="M30 102 V52 a12 12 0 0 1 12 -12 H458 a12 12 0 0 1 12 12 V102 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="48" y="68" text-anchor="start" font-size="18" font-weight="600" fill="#3C3489">Document</text><text x="48" y="89" text-anchor="start" font-size="13" font-weight="400" fill="#534AB7">One per uploaded file. Worked out from its chunks.</text><text x="48" y="128" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">doc_id</text><text x="188" y="128" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">First 16 characters of the file's SHA-256</text><text x="48" y="158" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">doc_name</text><text x="188" y="158" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Cleaned file name</text><text x="48" y="188" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">chunks</text><text x="188" y="188" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">How many pieces it was split into</text><text x="48" y="218" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">pages</text><text x="188" y="218" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Page count (0 for TXT and Markdown)</text><text x="48" y="248" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">ingested_at</text><text x="188" y="248" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">When it was added, UTC</text>
<rect x="540" y="40" width="440" height="314" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/><path d="M540 102 V52 a12 12 0 0 1 12 -12 H968 a12 12 0 0 1 12 12 V102 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="558" y="68" text-anchor="start" font-size="18" font-weight="600" fill="#085041">Chunk</text><text x="558" y="89" text-anchor="start" font-size="13" font-weight="400" fill="#0F6E56">One record in the ChromaDB collection "documents".</text><text x="558" y="128" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">id</text><text x="698" y="128" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">doc_id + ":" + position, e.g. 3fa9...:12</text><text x="558" y="158" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">document</text><text x="698" y="158" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">The text of the piece (about 800 chars)</text><text x="558" y="188" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">embedding</text><text x="698" y="188" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">384 numbers that capture its meaning</text><text x="558" y="218" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">doc_id</text><text x="698" y="218" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Which document it belongs to</text><text x="558" y="248" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">doc_name</text><text x="698" y="248" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">File name, shown in citations</text><text x="558" y="278" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">page</text><text x="698" y="278" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">PDF page number (0 = no pages)</text><text x="558" y="308" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">chunk_index</text><text x="698" y="308" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Position inside the document</text><text x="558" y="338" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">ingested_at</text><text x="698" y="338" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">When it was added, UTC</text>
<line x1="470" y1="120" x2="536" y2="120" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="503" y="108" text-anchor="middle" font-size="13" font-weight="400" fill="#5F5E5A">1 to many</text>
<rect x="30" y="304" width="440" height="224" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/><path d="M30 366 V316 a12 12 0 0 1 12 -12 H458 a12 12 0 0 1 12 12 V366 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="48" y="332" text-anchor="start" font-size="18" font-weight="600" fill="#085041">Evaluation report</text><text x="48" y="353" text-anchor="start" font-size="13" font-weight="400" fill="#0F6E56">One file: chroma_data/latest_eval.json</text><text x="48" y="392" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">run_id</text><text x="188" y="392" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">When the run started</text><text x="48" y="422" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">dataset</text><text x="188" y="422" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">test, real, dev or your documents</text><text x="48" y="452" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">config</text><text x="188" y="452" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Model, top-k, gate, reranker on or off</text><text x="48" y="482" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">summary</text><text x="188" y="482" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">The scores shown as tiles</text><text x="48" y="512" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">results[]</text><text x="188" y="512" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">One row per question, with the answer</text>
<rect x="540" y="394" width="440" height="224" rx="12" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/><path d="M540 456 V406 a12 12 0 0 1 12 -12 H968 a12 12 0 0 1 12 12 V456 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="558" y="422" text-anchor="start" font-size="18" font-weight="600" fill="#2C2C2A">Never stored</text><text x="558" y="443" text-anchor="start" font-size="13" font-weight="400" fill="#5F5E5A">Kept in memory only, or not kept at all.</text><text x="558" y="482" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">uploaded file</text><text x="698" y="482" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Read in memory, then discarded</text><text x="558" y="512" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">questions</text><text x="698" y="512" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Server log only (first 200 characters)</text><text x="558" y="542" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">answers</text><text x="698" y="542" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Returned to you, not saved</text><text x="558" y="572" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">API keys</text><text x="698" y="572" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Read from environment variables</text><text x="558" y="602" font-size="14" font-family="Consolas, Menlo, monospace" fill="#2C2C2A">rate limits</text><text x="698" y="602" text-anchor="start" font-size="13.5" font-weight="400" fill="#5F5E5A">Counters in memory, reset on restart</text>
<text x="505" y="654" text-anchor="middle" font-size="15" font-weight="400" fill="#5F5E5A">Purple = worked out, not a table   ·   Teal = saved on disk   ·   Gray = not saved</text>
</svg>
