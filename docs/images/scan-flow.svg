<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 912" width="1000" height="912" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="How a scanned page is read">
<title>How a scanned page is read</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="912" fill="#FFFFFF"/>
<rect x="60" y="30" width="520" height="78" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="320.0" y="64" text-anchor="middle" font-size="20" font-weight="600" fill="#2C2C2A">One page of your PDF</text><text x="320.0" y="86" text-anchor="middle" font-size="15" fill="#5F5E5A">Typed, scanned, or a photo of a page</text>
<rect x="60" y="148" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="182" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">1  ·  Read the text layer</text><text x="320.0" y="204" text-anchor="middle" font-size="15" fill="#534AB7">Pull out the text that is typed into the page</text>
<rect x="60" y="266" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="300" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">2  ·  Any text on this page?</text><text x="320.0" y="322" text-anchor="middle" font-size="15" fill="#534AB7">A scanned page is only a picture, so it has none</text>
<rect x="60" y="384" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="418" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">3  ·  Turn the page into a picture</text><text x="320.0" y="440" text-anchor="middle" font-size="15" fill="#534AB7">Rendered in memory at 144 dpi, never saved</text>
<rect x="60" y="502" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="536" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">4  ·  OCR</text><text x="320.0" y="558" text-anchor="middle" font-size="15" fill="#534AB7">A local model finds each line of text and reads it</text>
<rect x="60" y="620" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="654" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">5  ·  Put the lines in reading order</text><text x="320.0" y="676" text-anchor="middle" font-size="15" fill="#534AB7">Top to bottom, then left to right</text>
<rect x="60" y="738" width="520" height="78" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="320.0" y="772" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">Page text</text><text x="320.0" y="794" text-anchor="middle" font-size="15" fill="#0F6E56">Then split, embedded and stored like any other page</text>
<line x1="320.0" y1="108" x2="320.0" y2="144" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="226" x2="320.0" y2="262" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="344" x2="320.0" y2="380" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="462" x2="320.0" y2="498" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="580" x2="320.0" y2="616" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="698" x2="320.0" y2="734" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="334.0" y="368" text-anchor="start" font-size="14" font-weight="400" fill="#5F5E5A">no: it is a scan</text>
<rect x="660" y="502" width="290" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="805.0" y="536" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Typed page</text><text x="805.0" y="558" text-anchor="middle" font-size="15" fill="#534AB7">Text is used as it is, no OCR</text>
<path d="M580 305.0 H805.0 V498" fill="none" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="594" y="295.0" text-anchor="start" font-size="14" font-weight="400" fill="#5F5E5A">yes</text>
<path d="M805.0 580 V777.0 H584" fill="none" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="500" y="852" text-anchor="middle" font-size="15" font-weight="400" fill="#5F5E5A">A scan longer than 25 pages, or one in which nothing can be read, is refused with a clear error.</text>
<text x="500" y="884" text-anchor="middle" font-size="15" font-weight="400" fill="#5F5E5A">Gray = you   ·   Purple = logic on your machine   ·   Teal = result</text>
</svg>
