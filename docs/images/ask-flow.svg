<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 896" width="1000" height="896" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="How a question becomes an answer">
<title>How a question becomes an answer</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="896" fill="#FFFFFF"/>
<rect x="60" y="30" width="520" height="78" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="320.0" y="64" text-anchor="middle" font-size="20" font-weight="600" fill="#2C2C2A">Your question</text><text x="320.0" y="86" text-anchor="middle" font-size="15" fill="#5F5E5A">"How many days of annual leave in 2025?"</text>
<rect x="60" y="148" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="182" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">1  ·  Search</text><text x="320.0" y="204" text-anchor="middle" font-size="15" fill="#534AB7">Find the 20 passages closest in meaning</text>
<rect x="60" y="266" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="300" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">2  ·  Rerank</text><text x="320.0" y="322" text-anchor="middle" font-size="15" fill="#534AB7">A second model re-reads them and keeps the best 5</text>
<rect x="60" y="384" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="418" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">3  ·  Gate</text><text x="320.0" y="440" text-anchor="middle" font-size="15" fill="#534AB7">Is the best passage related enough? (score 0.40 or more)</text>
<rect x="60" y="502" width="520" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="320.0" y="536" text-anchor="middle" font-size="20" font-weight="600" fill="#712B13">4  ·  Ask the LLM</text><text x="320.0" y="558" text-anchor="middle" font-size="15" fill="#993C1D">"Answer only from these passages and say which you used"</text>
<rect x="60" y="620" width="520" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="320.0" y="654" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">5  ·  Check the answer</text><text x="320.0" y="676" text-anchor="middle" font-size="15" fill="#534AB7">Remove citations that were not retrieved; check the numbers</text>
<rect x="60" y="738" width="520" height="78" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="320.0" y="772" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">Answer + evidence</text><text x="320.0" y="794" text-anchor="middle" font-size="15" fill="#0F6E56">Document name, page and the exact sentences</text>
<line x1="320.0" y1="108" x2="320.0" y2="144" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="226" x2="320.0" y2="262" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="344" x2="320.0" y2="380" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="462" x2="320.0" y2="498" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="580" x2="320.0" y2="616" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="320.0" y1="698" x2="320.0" y2="734" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="334.0" y="486" text-anchor="start" font-size="14" font-weight="400" fill="#5F5E5A">yes</text>
<text x="334.0" y="722" text-anchor="start" font-size="14" font-weight="400" fill="#5F5E5A">at least one citation left</text>
<rect x="660" y="502" width="290" height="78" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text x="805.0" y="536" text-anchor="middle" font-size="20" font-weight="600" fill="#791F1F">"Not available"</text><text x="805.0" y="558" text-anchor="middle" font-size="15" fill="#A32D2D">Says so clearly, cites nothing</text>
<path d="M580 423.0 H805.0 V498" fill="none" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="594" y="413.0" text-anchor="start" font-size="13" font-weight="400" fill="#5F5E5A">no: off-topic, the LLM is never called</text>
<path d="M580 659.0 H805.0 V584" fill="none" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="594" y="681.0" text-anchor="start" font-size="13" font-weight="400" fill="#5F5E5A">the LLM said "not in the sources",</text>
<text x="594" y="699.0" text-anchor="start" font-size="13" font-weight="400" fill="#5F5E5A">or no citation survived</text>
<text x="500" y="866" text-anchor="middle" font-size="15" font-weight="400" fill="#5F5E5A">Gray = you   ·   Purple = logic   ·   Coral = outside service   ·   Teal = result   ·   Red = refusal</text>
</svg>
