<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="How a document is added">
<title>How a document is added</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="210" fill="#FFFFFF"/>
<rect x="15" y="30" width="150" height="110" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="90.0" y="71" text-anchor="middle" font-size="18" font-weight="600" fill="#2C2C2A">Your file</text><text x="90.0" y="91" text-anchor="middle" font-size="12.5" fill="#5F5E5A">PDF, TXT</text><text x="90.0" y="110" text-anchor="middle" font-size="12.5" fill="#5F5E5A">or Markdown</text>
<rect x="180" y="30" width="150" height="110" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="255.0" y="71" text-anchor="middle" font-size="18" font-weight="600" fill="#3C3489">Read</text><text x="255.0" y="91" text-anchor="middle" font-size="12.5" fill="#534AB7">Typed text, or OCR</text><text x="255.0" y="110" text-anchor="middle" font-size="12.5" fill="#534AB7">for scanned pages</text>
<line x1="166" y1="85.0" x2="177" y2="85.0" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="345" y="30" width="150" height="110" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="420.0" y="71" text-anchor="middle" font-size="18" font-weight="600" fill="#3C3489">Fingerprint</text><text x="420.0" y="91" text-anchor="middle" font-size="12.5" fill="#534AB7">Same file again?</text><text x="420.0" y="110" text-anchor="middle" font-size="12.5" fill="#534AB7">Replace, not duplicate</text>
<line x1="331" y1="85.0" x2="342" y2="85.0" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="510" y="30" width="150" height="110" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="585.0" y="71" text-anchor="middle" font-size="18" font-weight="600" fill="#3C3489">Split</text><text x="585.0" y="91" text-anchor="middle" font-size="12.5" fill="#534AB7">Pieces of about</text><text x="585.0" y="110" text-anchor="middle" font-size="12.5" fill="#534AB7">800 characters</text>
<line x1="496" y1="85.0" x2="507" y2="85.0" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="675" y="30" width="150" height="110" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="750.0" y="71" text-anchor="middle" font-size="18" font-weight="600" fill="#3C3489">Embed</text><text x="750.0" y="91" text-anchor="middle" font-size="12.5" fill="#534AB7">Turn each piece into</text><text x="750.0" y="110" text-anchor="middle" font-size="12.5" fill="#534AB7">384 numbers</text>
<line x1="661" y1="85.0" x2="672" y2="85.0" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="840" y="30" width="150" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="915.0" y="71" text-anchor="middle" font-size="18" font-weight="600" fill="#085041">Store</text><text x="915.0" y="91" text-anchor="middle" font-size="12.5" fill="#0F6E56">Saved in ChromaDB,</text><text x="915.0" y="110" text-anchor="middle" font-size="12.5" fill="#0F6E56">ready to search</text>
<line x1="826" y1="85.0" x2="837" y2="85.0" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<text x="500" y="184" text-anchor="middle" font-size="15" font-weight="400" fill="#5F5E5A">Gray = you   ·   Purple = logic   ·   Teal = stored data</text>
</svg>
