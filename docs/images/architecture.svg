<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="System architecture">
<title>System architecture</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="840" fill="#FFFFFF"/>
<rect x="60" y="40" width="410" height="84" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="265.0" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#2C2C2A">Web console</text><text x="265.0" y="99" text-anchor="middle" font-size="15" fill="#5F5E5A">Ask  ·  Upload  ·  Evaluate</text>
<rect x="530" y="40" width="410" height="84" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="735.0" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#2C2C2A">Other programs</text><text x="735.0" y="99" text-anchor="middle" font-size="15" fill="#5F5E5A">curl  ·  scripts  ·  /docs page</text>
<line x1="265" y1="124" x2="265" y2="196" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/><text x="279.0" y="165.0" text-anchor="start" font-size="14" fill="#5F5E5A">HTTP + optional key</text>
<line x1="735" y1="124" x2="735" y2="196" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/><text x="749.0" y="165.0" text-anchor="start" font-size="14" fill="#5F5E5A">HTTP + optional key</text>
<rect x="60" y="200" width="880" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="500.0" y="237" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">FastAPI  ·  the only way in</text><text x="500.0" y="259" text-anchor="middle" font-size="15" fill="#534AB7">checks every request  ·  routes  ·  one error format</text>
<line x1="500" y1="284" x2="500" y2="342" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="46" y="348" width="908" height="262" rx="14" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1.3" stroke-dasharray="7 6"/><text x="70" y="378" text-anchor="start" font-size="16" font-weight="600" fill="#5F5E5A">What happens inside</text>
<rect x="60" y="394" width="280" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="200.0" y="431" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Ingestion</text><text x="200.0" y="453" text-anchor="middle" font-size="15" fill="#534AB7">Read, OCR scans, split</text>
<rect x="360" y="394" width="280" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="500.0" y="431" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Retrieval</text><text x="500.0" y="453" text-anchor="middle" font-size="15" fill="#534AB7">Search, rerank, gate</text>
<rect x="660" y="394" width="280" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="800.0" y="431" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Answering</text><text x="800.0" y="453" text-anchor="middle" font-size="15" fill="#534AB7">Prompt, validate, cite</text>
<rect x="60" y="502" width="280" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="200.0" y="539" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Security</text><text x="200.0" y="561" text-anchor="middle" font-size="15" fill="#534AB7">Keys, rate limits, size caps</text>
<rect x="360" y="502" width="280" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="500.0" y="539" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Model failover</text><text x="500.0" y="561" text-anchor="middle" font-size="15" fill="#534AB7">Retries, 3 models in a chain</text>
<rect x="660" y="502" width="280" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="800.0" y="539" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Evaluation</text><text x="800.0" y="561" text-anchor="middle" font-size="15" fill="#534AB7">Question sets, scores, judge</text>
<line x1="500" y1="610" x2="500" y2="668" stroke="#888780" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="60" y="674" width="205" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="162.5" y="711" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">Local models</text><text x="162.5" y="733" text-anchor="middle" font-size="15" fill="#534AB7">Embedder, reranker, OCR</text>
<rect x="285" y="674" width="205" height="84" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="387.5" y="711" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">Vector store</text><text x="387.5" y="733" text-anchor="middle" font-size="15" fill="#0F6E56">ChromaDB on disk</text>
<rect x="510" y="674" width="205" height="84" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="612.5" y="711" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">Eval report</text><text x="612.5" y="733" text-anchor="middle" font-size="15" fill="#0F6E56">latest_eval.json</text>
<rect x="735" y="674" width="205" height="84" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text x="837.5" y="711" text-anchor="middle" font-size="20" font-weight="600" fill="#712B13">LLM provider</text><text x="837.5" y="733" text-anchor="middle" font-size="15" fill="#993C1D">Groq / OpenAI / Gemini</text>
<text x="500" y="806" text-anchor="middle" font-size="15" font-weight="400" fill="#5F5E5A">Gray = people and programs   ·   Purple = logic   ·   Teal = stored data   ·   Coral = outside service</text>
</svg>
