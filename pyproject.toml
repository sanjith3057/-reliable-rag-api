[project]
name = "reliable-rag-api"
version = "1.0.0"
description = "A RAG API that cites its evidence and abstains when the documents do not answer."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File(...) / Depends(...) defaults are intentional

[tool.ruff.lint.per-file-ignores]
"app/generation/prompt.py" = ["E501"]  # prompt text reads better unwrapped
